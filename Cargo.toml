[package]
name = "drift"
version = "1.7.0"
edition = "2021"
rust-version = "1.88"
description = "A Vim-style terminal music player for YouTube Music (no login required)"
license = "GPL-3.0-or-later"

[workspace]

[dependencies]
ratatui = "0.30.2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "3", features = ["json"] }
dirs = "5"
libc = "0.2"
discord-rich-presence = "1.1.0"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
ratatui-image = { version = "10.0.8", default-features = false, features = ["crossterm"] }

[target.'cfg(target_os = "linux")'.dependencies]
souvlaki = { version = "0.9", default-features = false, features = ["use_zbus"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
souvlaki = { version = "0.9", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
