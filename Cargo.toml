[package]
name = "drift"
version = "1.6.1"
edition = "2021"
description = "A Vim-style terminal music player for YouTube Music (no login required)"
license = "GPL-3.0-or-later"

[workspace]

[dependencies]
ratatui = "0.29"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", features = ["json"] }
dirs = "5"
libc = "0.2"
discord-rich-presence = "1.1.0"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }

[target.'cfg(target_os = "linux")'.dependencies]
souvlaki = { version = "0.9", default-features = false, features = ["use_zbus"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
