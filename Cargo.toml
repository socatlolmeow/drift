[package]
name = "drift"
version = "0.1.0"
edition = "2021"

[workspace]
description = "A Vim-style terminal music player for YouTube Music (no login required)"
license = "MIT"

[dependencies]
ratatui = "0.29"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", features = ["json"] }
dirs = "5"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
