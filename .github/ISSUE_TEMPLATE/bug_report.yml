name: Bug report
description: Report something that isn't working correctly in Drift.
title: "[Bug]: "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug!
        Please provide as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clearly describe the bug.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start Drift
        2. Search for a song
        3. Press Enter
        4. See the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Error messages
      description: Include relevant terminal output.
      render: shell

  - type: input
    id: version
    attributes:
      label: Drift version
      placeholder: e.g. 0.1.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Arch Linux
        - Debian / Ubuntu
        - Fedora
        - NixOS
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: input
    id: terminal
    attributes:
      label: Terminal emulator
      placeholder: e.g. Kitty, Alacritty, Ghostty

  - type: input
    id: mpv
    attributes:
      label: mpv version
      placeholder: Run mpv --version

  - type: input
    id: ytdlp
    attributes:
      label: yt-dlp version
      placeholder: Run yt-dlp --version

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have checked existing issues.
          required: true
        - label: I am using the latest available version.
          required: false
